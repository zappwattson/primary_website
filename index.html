    <section class="panel">
      <div class="card">
        <div class="content">
          <div class="head">
            <h2>About Zapp</h2>
          </div>
          <div class="profile" id="zapp-profile"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="card">
        <div class="content">
          <div class="head">
            <h2>About Pixel</h2>
          </div>
          <div class="profile" id="pixel-profile"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="card">
        <div class="content">
          <div class="head">
            <h2>Games Beaten <span id="count"></span></h2>
            <label class="per-page">Show
              <select id="per-page">
                <option>10</option>
                <option>25</option>
                <option>50</option>
              </select>
            </label>
          </div>
          <div class="sort">
            <button type="button" data-sort="date">Completion Order</button>
            <button type="button" data-sort="recent">Most Recent</button>
            <button type="button" data-sort="name">Alphabetical</button>
          </div>
          <div class="letters" id="letters" hidden></div>
          <div class="table-wrap games-wrap">
            <table class="numbered">
              <thead>
                <tr><th>#</th><th>Game</th><th>Date Beaten</th><th>Streams</th><th>Notes</th></tr>
              </thead>
              <tbody id="games-body"></tbody>
            </table>
          </div>
          <div class="pager">
            <button type="button" id="prev">Prev</button>
            <span id="page-info"></span>
            <button type="button" id="next">Next</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="card">
        <div class="content">
          <div class="head">
            <h2>Credits</h2>
          </div>
          <div class="table-wrap">
            <table class="credits">
              <thead>
                <tr><th>Role</th><th>Name</th></tr>
              </thead>
              <tbody id="credits-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="modal-overlay" id="contactModal">
  <div class="modal">
    <button type="button" class="modal-close" aria-label="Close">&times;</button>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeOuLQNG0cR1UKA59njw3TACgETzgEr_l9NihkmpWikYaCgQA/viewform?embedded=true" width="640" height="1035" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
  </div>
</div>

<script src="games.js"></script>
<script src="credits.js"></script>
<script src="about.js"></script>
<script src="script.js"></script>

</body>
