<meta charset="UTF-8">
<title>Zapp Wattson - VTuber</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="images/favicon48.png">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    padding: 40px;
    display: flex;
    flex-direction: column;
    font-family: 'Schibsted Grotesk', sans-serif;
    background:
      linear-gradient(to bottom, rgba(40, 48, 77, .75), rgba(26, 100, 153, .75), rgba(40, 48, 77, .75)),
      url('images/Background_Texture.jpg') center / cover fixed no-repeat;
  }

  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: min(90%, 720px);
    overflow: hidden;
    border-radius: 20px;
    background: linear-gradient(60deg, #3E3C4F 60%, #B0B0B0);
  }

  .banner {
    position: relative;
    aspect-ratio: 16 / 7;
    background: url('images/ZappWattson_banner.jpg') center / cover;
  }

  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(45deg, rgba(62, 60, 79, .9) 13%, rgba(166, 169, 255, .22));
  }

  .banner-text {
    position: absolute;
    left: 5%;
    right: 5%;
    bottom: 6%;
    z-index: 1;
  }

  .banner-text h1 {
    font: 400 clamp(24px, 6vw, 50px) / 1.1 'Russo One', sans-serif;
    letter-spacing: -.01em;
    color: #fff;
  }

  .banner-text p {
    margin-top: 8px;
    font: 400 clamp(11px, 2.2vw, 14px) 'Russo One', sans-serif;
    color: #fff;
  }

  .body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 28px 32px 32px;
    flex-wrap: wrap;
  }

  .socials {
    display: flex;
    gap: 18px;
  }

  .socials a {
    display: flex;
    align-items: center;
    height: 26px;
  }

  .socials svg {
    display: block;
    height: 100%;
    width: auto;
  }

  .socials path {
    fill: #ADE7FF;
    transition: fill .15s ease;
  }

  .socials a:hover path {
    fill: #fff;
  }

  .youtube-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 13px 26px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #5819A8, #78BEFF);
    color: #fff;
    font: 600 15px 'Schibsted Grotesk', sans-serif;
    text-decoration: none;
    white-space: nowrap;
  }

  .youtube-button svg {
    width: 18px;
    height: 18px;
  }
</style>
</head>
